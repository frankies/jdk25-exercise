name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Summarize test results
        if: always()
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if test results exist using find command
          TEST_RESULTS_DIR="build/test-results/test"
          
          if [ -d "$TEST_RESULTS_DIR" ] && [ "$(ls -A $TEST_RESULTS_DIR 2>/dev/null)" ]; then
            # Get test statistics from JUnit XML
            TEST_COUNT=0
            PASSED_COUNT=0
            FAILED_COUNT=0
            ERROR_COUNT=0
            SKIPPED_COUNT=0
            
            # Find all test result files
            find "$TEST_RESULTS_DIR" -name "TEST-*.xml" -type f | while read -r xml_file; do
              echo "Processing: $xml_file" >> $GITHUB_STEP_SUMMARY
            done
            
            # Extract stats from the first XML file (or aggregate all)
            for xml_file in "$TEST_RESULTS_DIR"/TEST-*.xml; do
              if [ -f "$xml_file" ]; then
                # Parse test results
                tests=$(grep -oP 'tests="\K[0-9]+' "$xml_file" | head -1)
                failures=$(grep -oP 'failures="\K[0-9]+' "$xml_file" | head -1)
                errors=$(grep -oP 'errors="\K[0-9]+' "$xml_file" | head -1)
                skipped=$(grep -oP 'skipped="\K[0-9]+' "$xml_file" | head -1)
                
                TEST_COUNT=${tests:-0}
                FAILED_COUNT=${failures:-0}
                ERROR_COUNT=${errors:-0}
                SKIPPED_COUNT=${skipped:-0}
                PASSED_COUNT=$((TEST_COUNT - FAILED_COUNT - ERROR_COUNT))
                
                echo "Found test results in: $xml_file" >> $GITHUB_STEP_SUMMARY
              fi
            done
            
            if [ "$FAILED_COUNT" -eq 0 ] && [ "$ERROR_COUNT" -eq 0 ]; then
              echo "✅ **All tests passed!** ($TEST_COUNT tests)" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ **Some tests failed or errored** ($TEST_COUNT tests)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Create test summary table
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|:--------|:------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests Run | $TEST_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Errors | $ERROR_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚧 Skipped | $SKIPPED_COUNT |" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # List test classes
            echo "### Test Classes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for xml_file in "$TEST_RESULTS_DIR"/TEST-*.xml; do
              if [ -f "$xml_file" ]; then
                class_name=$(basename "$xml_file" .xml | sed 's/TEST-//')
                echo "- \`$class_name\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📄 **Full test reports:** [Test Reports](/artifacts/test-reports)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **No test results found**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔍 Check the build logs for more details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by Gradle Test Report*" >> $GITHUB_STEP_SUMMARY
          
          # Also print to stdout
          echo ""
          echo "=== Test Results Summary ==="
          if [ -d "$TEST_RESULTS_DIR" ] && [ "$(ls -A $TEST_RESULTS_DIR 2>/dev/null)" ]; then
            echo "Test reports found: $TEST_COUNT tests, $PASSED_COUNT passed, $FAILED_COUNT failed, $ERROR_COUNT errors"
          else
            echo "No test results found in $TEST_RESULTS_DIR"
          fi
          echo "==========================="
          echo ""

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: application-package
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Generate gradle.lockfile
        run: ./gradlew dependencies --write-locks --no-daemon

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: '0'
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'

      - name: Generate SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          limit-severities-for-sarif: true
          skip-setup-trivy: true
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'

      - name: Summarize Trivy findings
        if: always()
        run: |
          echo "## 🔒 Dependency Vulnerability Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "trivy-results.json" ]; then
            # Extract vulnerability data from JSON
            VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities | length] | add // 0' trivy-results.json 2>/dev/null || echo "0")
            
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "⚠️ **Found $VULN_COUNT HIGH/CRITICAL vulnerability(ies)**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Create a table of vulnerabilities
              echo "| Severity | Package | CVE | Installed Version | Fixed Version |" >> $GITHUB_STEP_SUMMARY
              echo "|:----------|:---------|:-----|:-------------------|:---------------|" >> $GITHUB_STEP_SUMMARY
              
              # Process each vulnerability and add to table
              jq -r '.Results[]?.Vulnerabilities[]? | 
                [.Severity, .PkgName, (.ID // "N/A"), .InstalledVersion, (.FixedVersion // "N/A")] | @tsv' trivy-results.json 2>/dev/null | \
                while IFS=$'\t' read -r severity pkg cve installed fixed; do
                  # Skip empty lines
                  [ -z "$severity" ] && continue
                  
                  # Map severity to emoji
                  case "$severity" in
                    CRITICAL) emoji="🔴" ;;
                    HIGH) emoji="🟠" ;;
                    MEDIUM) emoji="🟡" ;;
                    LOW) emoji="⚪" ;;
                    *) emoji="❓" ;;
                  esac
                  echo "$emoji | $pkg | $cve | $installed | $fixed" >> $GITHUB_STEP_SUMMARY
                done
              
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "📄 **Full report:** [trivy-results.json](/action-results/trivy-results.json)" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **No HIGH/CRITICAL vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "🎉 All dependencies are up-to-date and secure!" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ **Trivy scan did not produce results**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the workflow logs for more details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by [Trivy Action](https://github.com/aquasecurity/trivy-action)*" >> $GITHUB_STEP_SUMMARY
          
          # Print summary to stdout as well
          echo ""
          echo "=== Trivy Scan Summary ==="
          if [ -f "trivy-results.json" ]; then
            VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities | length] | add // 0' trivy-results.json 2>/dev/null || echo "0")
            echo "Total vulnerabilities found: $VULN_COUNT"
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "Please review the GitHub Actions summary for details."
            else
              echo "No vulnerabilities found!"
            fi
          else
            echo "No Trivy results file found."
          fi
          echo "=========================="
          echo ""

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-reports
          path: |
            trivy-results.json
            trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30