name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: application-package
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: '0'
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'

      - name: Check vulnerabilities and generate SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          limit-severities-for-sarif: true
          skip-setup-trivy: true
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-reports
          path: |
            trivy-results.json
            trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30